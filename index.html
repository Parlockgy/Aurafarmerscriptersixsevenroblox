<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandboxels - Falling Sand Simulation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="main-content">
            <canvas id="canvas"></canvas>
            <div class="ui-overlay">
                <div class="top-bar">
                    <h1>Sandboxels</h1>
                    <div class="controls">
                        <button id="pauseBtn" class="btn">Pause</button>
                        <button id="clearBtn" class="btn danger">Clear All</button>
                        <button id="saveBtn" class="btn">Save</button>
                        <button id="loadBtn" class="btn">Load</button>
                        <button id="settingsBtn" class="btn">Settings</button>
                    </div>
                </div>

                <div class="left-panel">
                    <div class="panel-section">
                        <h3>Tool</h3>
                        <div class="tool-buttons">
                            <button class="tool-btn active" data-tool="draw" title="Draw (B)">✏️ Draw</button>
                            <button class="tool-btn" data-tool="erase" title="Erase (E)">🗑️ Erase</button>
                        </div>
                    </div>

                    <div class="panel-section">
                        <h3>Brush Size</h3>
                        <div class="brush-size-control">
                            <input type="range" id="brushSize" min="1" max="50" value="5">
                            <span id="brushSizeLabel">5</span>
                        </div>
                    </div>

                    <div class="panel-section">
                        <h3>Elements</h3>
                        <input type="text" id="elementSearch" placeholder="Search elements..." class="search-input">
                        <div id="elementList" class="element-list"></div>
                    </div>
                </div>

                <div class="bottom-bar">
                    <div class="stats">
                        <span>Particles: <strong id="particleCount">0</strong></span>
                        <span>FPS: <strong id="fps">60</strong></span>
                        <span>Temp: <strong id="tempDisplay">N/A</strong></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <label class="setting-item">
                    <input type="checkbox" id="showGridToggle">
                    <span>Show Grid</span>
                </label>
                <label class="setting-item">
                    <input type="checkbox" id="showTempToggle">
                    <span>Show Temperature</span>
                </label>
                <label class="setting-item">
                    <span>Simulation Speed: </span>
                    <input type="range" id="simSpeed" min="0.1" max="2" step="0.1" value="1">
                    <span id="simSpeedLabel">1.0x</span>
                </label>
                <label class="setting-item">
                    <span>Max Particles: </span>
                    <input type="range" id="maxParticles" min="10000" max="1000000" step="10000" value="100000">
                    <span id="maxParticlesLabel">100000</span>
                </label>
            </div>
        </div>
    </div>

    <script src="elements.js"></script>
    <script src="reactions.js"></script>
    <script src="engine.js"></script>
</body>
</html>
